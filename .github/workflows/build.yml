name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --release --locked -- -D warnings

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/pkg/DeskPad | Out-Null
          Copy-Item target/release/DeskPad.exe dist/pkg/DeskPad/
          Copy-Item target/release/HN-DeskPad-Setup.exe dist/pkg/DeskPad/uninstall.exe
          Copy-Item packaging/README.txt "dist/pkg/DeskPad/使用说明.txt"
          Compress-Archive -Path dist/pkg/DeskPad -DestinationPath "dist/DeskPad-$ver-win-x64.zip" -Force
          Copy-Item target/release/HN-DeskPad-Setup.exe dist/
          Get-FileHash dist/*.zip, dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Remove-Item -Recurse dist/pkg
          Get-Content dist/SHA256SUMS.txt

      # 构建产物放到单提交的 builds 分支（每次强制覆盖），可直接 git 拉取
      - name: Publish to builds branch
        shell: pwsh
        run: |
          Set-Location dist
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
